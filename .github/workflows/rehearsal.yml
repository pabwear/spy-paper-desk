name: Dress rehearsal

# Runs the real desk program every 10 minutes of the last few trading days, on free 1-minute data
# (yfinance), with a simulated broker in a temporary folder. It never touches Alpaca or the desk's
# real files; it saves what happened to desk-state (backtests/rehearsal.json) for the dashboard's
# Record view. Weekly on Saturdays, or by hand.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Trading days to replay (yfinance keeps about 7 days of 1-minute bars)"
        default: "5"
  schedule:
    - cron: "17 14 * * 6"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --quiet -r requirements.txt
      - name: Rehearse
        env:
          DAYS: ${{ inputs.days || '5' }}
        run: |
          mkdir -p out
          python rehearsal.py --days "$DAYS" --json out/rehearsal.json > out/rehearsal.txt
          { echo '```'; cat out/rehearsal.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rehearsal
          path: out/rehearsal.json

  save:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: desk-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desk-state
      - uses: actions/download-artifact@v4
        with:
          name: rehearsal
          path: backtests/
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "rehearsal: $(date -u +%F)"
          git push -q origin HEAD:desk-state
