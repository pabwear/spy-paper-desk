name: Focus list

# Choose which stocks the desk watches. trade-on / trade-off switch paper trading for a non-SPY stock.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [add, remove, up, down, trade-on, trade-off]
        default: add
      symbol:
        description: "Stock (e.g. NVDA)"
        required: true
      instrument:
        description: "For trade-on: options or shares"
        type: choice
        options: ["", options, shares]
        default: ""

permissions:
  contents: write

concurrency:
  group: desk-state
  cancel-in-progress: false

jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: desk-state
          path: .state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: restore
        run: python cloud_state.py restore .state
      - env:
          ACTION: ${{ inputs.action }}
          SYMBOL: ${{ inputs.symbol }}
          INSTRUMENT: ${{ inputs.instrument }}
        run: python cloud_state.py focus
      - name: Save state
        run: |
          python cloud_state.py save .state
          cd .state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "focus: ${ACTION} ${SYMBOL}"
          git push -q origin HEAD:desk-state
        env:
          ACTION: ${{ inputs.action }}
          SYMBOL: ${{ inputs.symbol }}
