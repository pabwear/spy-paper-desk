name: ML research (walk-forward, paper only)

# Runs the ML engine's walk-forward evaluation on Alpaca's free IEX minute bars. Research only: it never places
# an order and never reads the locked holdout. Reports go to the ml-results branch (and as a run artifact).
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Ticker"
        default: "SPY"
      since:
        description: "First day of data"
        default: "2020-07-01"
      horizons:
        description: "Horizons in minutes"
        default: "15,30,60"
      models:
        description: "Models"
        default: "base_rate,logistic,gbt"
      target:
        description: "Label (up_net = a long trade made money after costs)"
        default: "up_net"

permissions:
  contents: write

concurrency:
  group: ml-research
  cancel-in-progress: false

jobs:
  walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - run: python -m pip install --quiet -r requirements-ml.txt
      - name: Restore the market-data cache
        uses: actions/cache@v4
        with:
          path: ml_cache
          key: ml-cache-${{ inputs.symbol }}-${{ github.run_id }}
          restore-keys: ml-cache-${{ inputs.symbol }}-
      - name: Walk-forward
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python -m ml.run walkforward --symbol "${{ inputs.symbol }}" --since "${{ inputs.since }}" \
            --horizons "${{ inputs.horizons }}" --models "${{ inputs.models }}" --target "${{ inputs.target }}" \
            --out out
      - uses: actions/upload-artifact@v4
        with:
          name: ml-report
          path: out/
      - name: Save the report to the ml-results branch
        run: |
          set -e
          tail -n 1 ml/experiments.jsonl > /tmp/line.jsonl
          cp -r out /tmp/out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin ml-results; then
            git checkout -q -B ml-results origin/ml-results
          else
            git checkout -q --orphan ml-results
            git rm -rq --cached . && git clean -fdq -e ml_cache
          fi
          mkdir -p reports
          cp /tmp/out/* reports/
          cat /tmp/line.jsonl >> experiments.jsonl
          git add reports experiments.jsonl
          git commit -qm "ml: walk-forward ${{ inputs.symbol }} $(date -u '+%F %H:%M') UTC"
          git push -q origin HEAD:ml-results
