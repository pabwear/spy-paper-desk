name: Desk settings

# Choices Roy can change without touching the code. Saved on desk-state (settings.json).
on:
  workflow_dispatch:
    inputs:
      extended_hours:
        description: "Read the Mxwll boxes with extended hours (04:00-20:00 ET), like a TradingView chart with ETH on"
        type: choice
        options: ["on", "off"]
        default: "on"
      box_timeframe:
        description: "Candle size the desk reads its Mxwll boxes on (your TradingView chart's timeframe)"
        type: choice
        options: ["unchanged", "3 minutes", "5 minutes"]
        default: "unchanged"

permissions:
  contents: write

concurrency:
  group: desk-state
  cancel-in-progress: false

jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: desk-state
          path: .state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python cloud_state.py restore .state
      - env:
          EXTENDED_HOURS: ${{ inputs.extended_hours }}
          BOX_TIMEFRAME: ${{ inputs.box_timeframe }}
        run: python cloud_state.py settings
      - name: Save state
        run: |
          python cloud_state.py save .state
          cd .state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "settings: extended hours ${EXTENDED_HOURS}, box candles ${BOX_TIMEFRAME}"
          git push -q origin HEAD:desk-state
        env:
          EXTENDED_HOURS: ${{ inputs.extended_hours }}
          BOX_TIMEFRAME: ${{ inputs.box_timeframe }}
