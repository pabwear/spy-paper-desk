name: Site (trade.riosventures.org)

# Puts the dashboard online at https://trade.riosventures.org behind a password, then copies the
# desk's current numbers there (after that, every desk run copies them: site_publish.py).
# Needs three repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts edit, Workers KV edit,
# Zone riosventures.org Workers Routes edit), CLOUDFLARE_ACCOUNT_ID and SITE_PASSWORD.
# Runs by hand (Actions → Site → Run workflow) and whenever the site's files change on main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Secrets in place?
        id: ready
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$SITE_PASSWORD" ] || missing="$missing SITE_PASSWORD"
          if [ -n "$missing" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
            echo "::notice::Site not deployed: repository secrets not added yet ($missing)."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
          if [ ${#SITE_PASSWORD} -lt 10 ]; then echo "::error::SITE_PASSWORD must be at least 10 characters."; exit 1; fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          ref: desk-state
          path: .state
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: steps.ready.outputs.go == 'true'
        name: Build the page
        run: python site/build.py
      - if: steps.ready.outputs.go == 'true'
        name: Deploy the Worker (creates trade.riosventures.org)
        working-directory: site
        run: npx --yes wrangler@4 deploy
      - if: steps.ready.outputs.go == 'true'
        name: Set the password
        working-directory: site
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: printf '%s' "$SITE_PASSWORD" | npx --yes wrangler@4 secret put SITE_PASSWORD
      - if: steps.ready.outputs.go == 'true'
        name: Copy the desk's current numbers to the site
        run: |
          pip install --quiet -r requirements.txt
          python cloud_state.py restore .state
          rm -f site_published.json  # first copy: send everything
          python site_publish.py
