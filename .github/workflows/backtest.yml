name: Backtest the call/put areas

# Research only: replays years of 1-minute SPY bars (Alpaca IEX, free with the desk's paper keys) through
# the desk's areas and rules, compares entry rules and settings, and saves the results to desk-state
# (backtests/). It reads market data only: no account calls, no orders.
on:
  workflow_dispatch:
    inputs:
      since:
        description: "First day to test (YYYY-MM-DD). Alpaca's free 1-minute history starts in July 2020."
        default: "2020-07-01"
      scope:
        description: "current = only the live desk's setup (quick); ideas = four ideas vs buy-and-hold; all = every setting (about 1,000)"
        type: choice
        options: ["current", "ideas", "research", "spreads", "all"]
        default: "current"
      round:
        description: "For scope 'research': the round (1, 2, ...) or final (the locked year, run once at the end)"
        default: "1"
      symbol:
        description: "Stock for scope 'ideas' (SPY runs every idea; another stock runs the share ideas)"
        default: "SPY"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: desk-state
          path: .state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --quiet -r requirements.txt
      - run: python cloud_state.py restore .state
      - name: Backtest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SINCE: ${{ inputs.since }}
          SCOPE: ${{ inputs.scope }}
          SYMBOL: ${{ inputs.symbol }}
          ROUND: ${{ inputs.round }}
        run: |
          mkdir -p out
          if [ "$SCOPE" = "spreads" ]; then
            python spreads.py --source alpaca --since "$SINCE" --json out/spreads.json --md out/spreads.md
            cat out/spreads.md >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SCOPE" = "research" ]; then
            case "$ROUND" in final|[0-9]|[0-9][0-9]) ;; *) echo "Bad round"; exit 1 ;; esac
            case "$SYMBOL" in ''|SPY) SYMBOL=SPY ;; *[!A-Za-z.]*) echo "Bad symbol"; exit 1 ;; esac
            mkdir -p out/research
            python research.py --source alpaca --since "$SINCE" --symbol "$SYMBOL" --round "$ROUND" \
              --json "out/research/$SYMBOL-$ROUND.json" --md "out/research/$SYMBOL-$ROUND.md"
            cat "out/research/$SYMBOL-$ROUND.md" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SCOPE" = "ideas" ]; then
            case "$SYMBOL" in ''|SPY) NAME=ideas ;; *[!A-Za-z.]*) echo "Bad symbol"; exit 1 ;; *) NAME="ideas-$(echo "$SYMBOL" | tr 'A-Z' 'a-z')" ;; esac
            python backtest_ideas.py --source alpaca --since "$SINCE" --symbol "${SYMBOL:-SPY}" --json "out/$NAME.json" --md "out/$NAME.md"
            cat "out/$NAME.md" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SCOPE" = "current" ]; then
            python backtest_areas.py --source alpaca --since "$SINCE" --current --json out/current.json --md out/current.md
            cat out/current.md >> "$GITHUB_STEP_SUMMARY"
          else
            python backtest_areas.py --source alpaca --since "$SINCE" --json out/areas.json --md out/areas.md
            cat out/areas.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: out/

  save:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: desk-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desk-state
      - uses: actions/download-artifact@v4
        with:
          name: backtest
          path: backtests/
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "backtest: call/put areas $(date -u +%F)"
          git push -q origin HEAD:desk-state
