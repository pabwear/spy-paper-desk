name: Desk (every 10 minutes)

# The desk's heartbeat. GitHub's clock is UTC; these three lines cover 09:30–16:20 New York time
# in both summer (EDT) and winter (EST). The first step skips anything outside market hours.
on:
  schedule:
    - cron: "30-59/10 13 * * 1-5"
    - cron: "*/10 14-20 * * 1-5"
    - cron: "0-20/10 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desk-state
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Market hours? (New York time)
        id: clock
        run: |
          hm=$(TZ=America/New_York date +%H%M); dow=$(TZ=America/New_York date +%u)
          if [ "$dow" -le 5 ] && [ "$hm" -ge 925 ] && [ "$hm" -le 1640 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Outside 09:25–16:40 ET on a weekday: nothing to do."
          fi
      - uses: actions/checkout@v4
        if: steps.clock.outputs.run == 'true'
      - uses: actions/checkout@v4
        if: steps.clock.outputs.run == 'true'
        with:
          ref: desk-state
          path: .state
      - uses: actions/setup-python@v5
        if: steps.clock.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - if: steps.clock.outputs.run == 'true'
        run: pip install --quiet -r requirements.txt
      - id: restore
        if: steps.clock.outputs.run == 'true'
        run: python cloud_state.py restore .state
      - name: Check the Alpaca keys (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          APCA_API_BASE_URL: https://paper-api.alpaca.markets
        run: python alpaca_client.py --save
      - name: Run the desk
        if: steps.clock.outputs.run == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          APCA_API_BASE_URL: https://paper-api.alpaca.markets
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          SHEETS_WEBHOOK_TOKEN: ${{ secrets.SHEETS_WEBHOOK_TOKEN }}
        run: python run_study.py tick
      - name: Save state to the desk-state branch
        if: always() && steps.restore.outcome == 'success'
        run: |
          python cloud_state.py save .state
          python cloud_state.py summary >> "$GITHUB_STEP_SUMMARY" || true
          cd .state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No state change."; exit 0; fi
          git commit -q -m "desk: $(TZ=America/New_York date '+%F %H:%M') ET"
          git push -q origin HEAD:desk-state
