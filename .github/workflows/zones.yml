name: Today's zones (09:30–09:59 ET)

# The morning form: type the Mxwll boxes from the chart. The desk refuses zones outside 09:30–09:59 ET.
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Stock (e.g. SPY)"
        default: "SPY"
        required: true
      red:
        description: "RED boxes (buy). LOW-HIGH, comma between boxes, e.g. 571.20-572.05"
        required: false
      green:
        description: "GREEN boxes (sell). LOW-HIGH, comma between boxes"
        required: false
      tags:
        description: "Optional chart tags, ZONE_NUMBER:TAG, e.g. 1:CHoCH"
        required: false
      none:
        description: "No readable boxes today (no trades)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desk-state
  cancel-in-progress: false

jobs:
  zones:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: desk-state
          path: .state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: restore
        run: python cloud_state.py restore .state
      - name: Publish the zones
        env:
          SYMBOL: ${{ inputs.symbol }}
          RED: ${{ inputs.red }}
          GREEN: ${{ inputs.green }}
          TAGS: ${{ inputs.tags }}
          NONE: ${{ inputs.none }}
        run: python cloud_state.py zones
      - name: Save state
        if: steps.restore.outcome == 'success'
        run: |
          python cloud_state.py save .state
          cd .state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "zones: $(TZ=America/New_York date '+%F %H:%M') ET"
          git push -q origin HEAD:desk-state
