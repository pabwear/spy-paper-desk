name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desk:
    name: Paper desk tests (no keys, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet numpy tzdata  # the projection uses numpy; the tests still never touch the network
      - run: python -m unittest discover -s tests -v
