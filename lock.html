<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPY Desk — Locked</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1012; --panel: #17181b; --line: #2a2b2f;
    --ink: #f4f4f2; --ink-2: #b9b8b0; --ink-3: #85847d;
    --accent: #3987e5; --bad: #e66767;
  }
  @media (prefers-color-scheme: light) {
    :root { color-scheme: light; --bg: #f3f2ef; --panel: #fcfcfb; --line: #e2e1dc;
            --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #75746e; --accent: #2a78d6; --bad: #d03b3b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
         color: var(--ink); font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width: min(340px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line);
          border-radius: 16px; padding: 28px 24px 24px; text-align: center; }
  .badge { display: inline-block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
           color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  h1 { font-size: 20px; margin: 14px 0 4px; font-weight: 600; }
  p.sub { margin: 0 0 22px; color: var(--ink-3); font-size: 13px; }
  .dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 10px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink-3); }
  .dot.on { background: var(--ink); border-color: var(--ink); }
  .msg { min-height: 20px; font-size: 13px; color: var(--bad); margin-bottom: 12px; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pad button { height: 56px; border-radius: 12px; border: 1px solid var(--line); background: transparent;
                color: var(--ink); font: 600 20px/1 inherit; font-family: inherit; cursor: pointer; }
  .pad button:hover { border-color: var(--ink-3); }
  .pad button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pad button.aux { font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }
</style>
</head>
<body>
  <main class="card" id="card">
    <span class="badge">Paper only</span>
    <h1>SPY paper desk</h1>
    <p class="sub">Enter your PIN to open the console</p>
    <div class="dots" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div class="pad" id="pad" aria-label="PIN keypad">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button class="aux" data-k="clear">Clear</button><button>0</button><button class="aux" data-k="back">Delete</button>
    </div>
  </main>
<script>
  const LEN = 4;
  let pin = "";
  let busy = false;
  const dots = [...document.querySelectorAll(".dot")];
  const msg = document.getElementById("msg");
  const card = document.getElementById("card");

  function paint() { dots.forEach((d, i) => d.classList.toggle("on", i < pin.length)); }

  async function submit() {
    busy = true;
    try {
      const res = await fetch("/unlock", { method: "POST", headers: { "Content-Type": "application/json" },
                                            body: JSON.stringify({ pin }) });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) { location.reload(); return; }
      msg.textContent = data.message || "Wrong PIN.";
      card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    } catch { msg.textContent = "Console is not reachable."; }
    pin = ""; paint(); busy = false;
  }

  function press(k) {
    if (busy) return;
    if (k === "clear") pin = "";
    else if (k === "back") pin = pin.slice(0, -1);
    else if (/^\d$/.test(k) && pin.length < LEN) pin += k;
    msg.textContent = "";
    paint();
    if (pin.length === LEN) submit();
  }

  document.getElementById("pad").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (b) press(b.dataset.k || b.textContent.trim());
  });
  document.addEventListener("keydown", (e) => {
    if (/^\d$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") press("back");
    else if (e.key === "Escape") press("clear");
  });
</script>
</body>
</html>
